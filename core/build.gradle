[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

repositories {
  maven { url 'https://jitpack.io' }
}

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.raeleus.TenPatch:tenpatch:5.2.3"
  implementation "com.google.code.gson:gson:2.11.0"
  implementation "com.github.pizpizi:pvz-skin:v0.1.1"
  implementation 'com.github.pizpizi:libPVZ:v0.1.6'
  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task runServer(type: JavaExec) {
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.pvz.server.PvzServer'
  // The server reads/writes user save files under the SAME relative
  // Constants.SAVE_PATH the desktop client uses (core/src/main/java/...).
  // The client's run task points its workingDir at the project root, so the
  // server must do the same or its leaderboard scans an empty directory.
  workingDir = rootProject.projectDir
}
