plugins {
    id 'application'
    id 'java'
    id 'checkstyle'
    id 'pmd'
}

// تنظیمات Checkstyle برای استفاده از فایل کانفیگ دانشگاه
checkstyle {
    toolVersion '10.12.5' // یا نسخه هماهنگ
    configFile file("config/checkstyle.xml") // آدرس فایل کانفیگ چکسایل که بهت دادن
    ignoreFailures = false // اگر خطایی بود بیلد متوقف بشه
}

// تنظیمات PMD برای استفاده از فایل کانفیگ دانشگاه
pmd {
    toolVersion '6.55.0'
    ruleSetFiles = files("config/pmd.xml") 
    ruleSets = [] // خالی گذاشتن برای استفاده صرفاً از فایل سفارشی
    ignoreFailures = false
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'pvz.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// Run the interactive zombie-walk demo directly from Gradle:
//   ./gradlew runDemo
tasks.register('runDemo', JavaExec) {
    group       = 'Demo'
    description = 'Run the ZombieWalkDemo CLI (interactive zombie simulation)'
    classpath   = sourceSets.main.runtimeClasspath
    mainClass   = 'pvz.Demo.ZombieWalkDemo'
    standardInput = System.in
    workingDir  = rootProject.projectDir
}

// Run the interactive Plants + Projectiles + Suns + Zombies demo:
//   ./gradlew runPlantWarDemo
tasks.register('runPlantWarDemo', JavaExec) {
    group       = 'Demo'
    description = 'Run the PlantWarDemo CLI (interactive plants/projectiles/suns/zombies simulation)'
    classpath   = sourceSets.main.runtimeClasspath
    mainClass   = 'pvz.Demo.PlantWarDemo'
    standardInput = System.in
    workingDir  = rootProject.projectDir
}
